name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Validate iOS resources before archive
        run: python3 tools/validate_ios_assets.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Restore App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          test -n "$APPLE_API_KEY_P8"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          mkdir -p "$HOME/private_keys"
          cp "$RUNNER_TEMP/AuthKey.p8" "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
      - name: Install distribution signing assets
        env:
          APPLE_DISTRIBUTION_CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT }}
          APPLE_DISTRIBUTION_KEY: ${{ secrets.APPLE_DISTRIBUTION_KEY }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          test -n "$APPLE_DISTRIBUTION_CERT"
          test -n "$APPLE_DISTRIBUTION_KEY"
          test -n "$APPLE_PROVISIONING_PROFILE"
          printf '%s' "$APPLE_DISTRIBUTION_CERT" | base64 --decode > "$RUNNER_TEMP/distribution.cer"
          printf '%s' "$APPLE_DISTRIBUTION_KEY" | base64 --decode > "$RUNNER_TEMP/distribution.key"
          printf '%s' "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/MachadoBiblioteca.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.key" \
            -k "$KEYCHAIN_PATH" \
            -P "" \
            -A \
            -T /usr/bin/codesign
          security import "$RUNNER_TEMP/distribution.cer" \
            -k "$KEYCHAIN_PATH" \
            -P "" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/MachadoBiblioteca.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/a2dc14b5-6c9b-43e2-aacd-5aafc341cc22.mobileprovision"
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate --spec project.yml
      - name: Run iOS unit tests
        run: xcodebuild test -project iosApp/MachadoBiblioteca.xcodeproj -scheme MachadoBiblioteca -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' CODE_SIGNING_ALLOWED=NO
      - name: Archive signed app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          xcodebuild \
            -project iosApp/MachadoBiblioteca.xcodeproj \
            -scheme MachadoBiblioteca \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/MachadoBiblioteca.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Machado Biblioteca Original App Store 2026" \
             DEVELOPMENT_TEAM=SRN7AW424S \
             CURRENT_PROJECT_VERSION=22 \
             TARGETED_DEVICE_FAMILY="1,2" \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            INFOPLIST_KEY_CFBundleIconName=AppIcon \
            INFOPLIST_KEY_UILaunchScreen_Generation=YES \
            archive
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MachadoBiblioteca.xcarchive" \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"
      - name: Verify archived app
        run: |
          app=("$RUNNER_TEMP"/MachadoBiblioteca.xcarchive/Products/Applications/*.app)
           for file in Assets.car catalog.json PrivacyInfo.xcprivacy; do
             test -f "${app[0]}/$file" || { echo "Missing archived resource: $file"; exit 1; }
           done
           for image in hero_dom hero_quincas hero_bras_cubas hero_literatura hero_universo avatar_capitu avatar_bras_cubas avatar_rubiao; do
             test "$(find "${app[0]}" -name "$image.*" | wc -l | tr -d ' ')" -gt 0 || { echo "Missing image resource: $image"; exit 1; }
           done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app[0]}/Info.plist")" = "br.com.machadodeassis.biblioteca" || { echo "Unexpected bundle identifier"; exit 1; }
           test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app[0]}/Info.plist")" = "1.1" || { echo "Unexpected marketing version"; exit 1; }
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${app[0]}/Info.plist")"
           test "$bundle_version" = "22" || { echo "Unexpected build version: $bundle_version"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "${app[0]}/Info.plist"
          codesign --verify --deep --strict "${app[0]}"
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: machado-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
      - name: Verify IPA resources
        run: |
          ipa=("$RUNNER_TEMP"/export/*.ipa)
          test -f "${ipa[0]}"
          rm -rf "$RUNNER_TEMP/ipa-unpacked"
          mkdir -p "$RUNNER_TEMP/ipa-unpacked"
          unzip -q "${ipa[0]}" -d "$RUNNER_TEMP/ipa-unpacked"
          unzip -l "${ipa[0]}" | grep -q '/catalog.json$'
          test "$(unzip -l "${ipa[0]}" | grep -E -c '/Texts/[^/]+\.json$')" -eq 31
          unzip -p "${ipa[0]}" "Payload/*.app/catalog.json" > "$RUNNER_TEMP/ipa-catalog.json"
          app=("$RUNNER_TEMP"/ipa-unpacked/Payload/*.app)
           test -f "${app[0]}/Assets.car"
           test -f "${app[0]}/PrivacyInfo.xcprivacy"
           for image in hero_dom hero_quincas hero_bras_cubas hero_literatura hero_universo avatar_capitu avatar_bras_cubas avatar_rubiao; do
             test "$(unzip -Z1 "${ipa[0]}" | grep -E -c "/$image\.(jpg|png)$")" -gt 0 || { echo "Missing IPA image resource: $image"; exit 1; }
           done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app[0]}/Info.plist")" = "br.com.machadodeassis.biblioteca"
           test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app[0]}/Info.plist")" = "1.1"
           test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${app[0]}/Info.plist")" = "22"
          codesign --verify --deep --strict "${app[0]}"
          python3 - "$RUNNER_TEMP/ipa-catalog.json" "${ipa[0]}" <<'PY'
          import json
          import subprocess
          import sys

          catalog = json.load(open(sys.argv[1], encoding="utf-8"))
          assert len(catalog) == 30
          listing = subprocess.check_output(["unzip", "-Z1", sys.argv[2]], text=True)
          for entry in catalog:
              path = next(line for line in listing.splitlines() if line.endswith(f"/Texts/{entry['id']}.json"))
              document = json.loads(subprocess.check_output(["unzip", "-p", sys.argv[2], path], text=True))
              assert len(document["chapters"]) == entry["chapters"]
          print("IPA resources OK: catalog and 30 texts")
          PY
      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          ipa=("$RUNNER_TEMP"/export/*.ipa)
          test -f "${ipa[0]}"
          xcrun altool --upload-app \
            --type ios \
            --file "${ipa[0]}" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"
