name: MachadoBiblioteca
options:
  bundleIdPrefix: br.com.machadodeassis
  xcodeVersion: "26.0"
  deploymentTarget:
    iPhone: "17.0"
    iPad: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: br.com.machadodeassis.biblioteca
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Info.plist
    DEVELOPMENT_TEAM: SRN7AW424S
    CODE_SIGN_STYLE: Automatic
targets:
  MachadoBiblioteca:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Texts
        type: folder
        buildPhase: resources
      - path: Resources/catalog.json
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Info.plist
    postCompileScripts:
      - name: Prepare App Store icon metadata
        script: |
          app_bundle="$TARGET_BUILD_DIR/$WRAPPER_NAME"
           xcrun actool "$SRCROOT/Resources/Assets.xcassets" \
             --compile "$app_bundle" \
            --platform iphoneos \
            --minimum-deployment-target 17.0 \
            --app-icon AppIcon \
            --target-device iphone \
             --target-device ipad \
             --output-partial-info-plist "$TARGET_TEMP_DIR/AppIconInfo.plist"
           cp "$SRCROOT/Resources/AppIcon-120.png" "$app_bundle/AppIcon-120.png"
           /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 2' "$app_bundle/Info.plist"
           /usr/libexec/PlistBuddy -c 'Delete :UISupportedInterfaceOrientations' "$app_bundle/Info.plist" || true
           /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations array' "$app_bundle/Info.plist"
           /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait' "$app_bundle/Info.plist"
           /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationPortraitUpsideDown' "$app_bundle/Info.plist"
           /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations:2 string UIInterfaceOrientationLandscapeLeft' "$app_bundle/Info.plist"
           /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations:3 string UIInterfaceOrientationLandscapeRight' "$app_bundle/Info.plist"
           /usr/libexec/PlistBuddy -c 'Delete :UISupportedInterfaceOrientations~ipad' "$app_bundle/Info.plist" || true
           /usr/libexec/PlistBuddy -c 'Copy :UISupportedInterfaceOrientations :UISupportedInterfaceOrientations~ipad' "$app_bundle/Info.plist"
           /usr/libexec/PlistBuddy -c 'Delete :UILaunchScreen' "$app_bundle/Info.plist" || true
           /usr/libexec/PlistBuddy -c 'Add :UILaunchScreen dict' "$app_bundle/Info.plist"
           /usr/libexec/PlistBuddy -c 'Set :CFBundleIconName AppIcon' "$app_bundle/Info.plist" || \
            /usr/libexec/PlistBuddy -c 'Add :CFBundleIconName string AppIcon' "$app_bundle/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :CFBundleIconFiles' "$app_bundle/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIconFiles array' "$app_bundle/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIconFiles:0 string AppIcon-120' "$app_bundle/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :CFBundleIcons' "$app_bundle/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons dict' "$app_bundle/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon dict' "$app_bundle/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array' "$app_bundle/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon-120' "$app_bundle/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon' "$app_bundle/Info.plist"
    settings:
      base:
        CURRENT_PROJECT_VERSION: "2"
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_CFBundleDisplayName: Machado de Assis
        INFOPLIST_KEY_UIBackgroundModes:
          - audio
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
