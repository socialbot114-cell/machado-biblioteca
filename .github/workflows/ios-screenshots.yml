name: Machado iOS Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: ${{ matrix.device_name }} screenshots
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_name: iPhone 17 Pro Max
            device_key: iphone-17-pro-max
          - device_name: iPhone 17
            device_key: iphone-17
          - device_name: iPad Air 13-inch (M4)
            device_key: ipad-air-13
    steps:
      - uses: actions/checkout@v5

      - name: Validate iOS resources
        run: python3 tools/validate_ios_assets.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate --spec project.yml

      - name: Prepare simulator (pt-BR, clean status bar)
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          name = sys.argv[1]
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS-26-5" in runtime:
                  for device in devices:
                      if device["name"] == name:
                          print(device["udid"]); raise SystemExit
          raise SystemExit("simulator not found: " + name)
          ' "${{ matrix.device_name }}")"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl spawn "$udid" defaults write -g AppleLanguages -array pt-BR
          xcrun simctl spawn "$udid" defaults write -g AppleLocale -string pt_BR
          xcrun simctl shutdown "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Run screenshot UI test
        working-directory: iosApp
        run: |
          set -euo pipefail
          xcodebuild test \
            -project MachadoBiblioteca.xcodeproj \
            -scheme MachadoBiblioteca \
            -destination "id=$SIM_UDID" \
            -resultBundlePath "$RUNNER_TEMP/machado-${{ matrix.device_key }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:MachadoBibliotecaScreenshotTests/MachadoScreenshotTests/testStoreScreenshots
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/machado-${{ matrix.device_key }}.xcresult" \
            --output-path "$RUNNER_TEMP/machado-screenshots-${{ matrix.device_key }}"

      - name: Validate screenshots
        run: |
          screenshot_dir="$RUNNER_TEMP/machado-screenshots-${{ matrix.device_key }}"
          test "$(find "$screenshot_dir" -type f -name '*.png' | wc -l | tr -d ' ')" -eq 6
          file "$screenshot_dir"/*.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: machado-ios-screenshots-${{ matrix.device_key }}
          path: ${{ runner.temp }}/machado-screenshots-${{ matrix.device_key }}
          if-no-files-found: error
