name: iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Validate iOS resources
        run: python3 tools/validate_ios_assets.py
      - name: Check XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate --spec project.yml
      - name: Build simulator target
        run: xcodebuild -project iosApp/MachadoBiblioteca.xcodeproj -scheme MachadoBiblioteca -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Run iOS unit tests
        run: xcodebuild test -project iosApp/MachadoBiblioteca.xcodeproj -scheme MachadoBiblioteca -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' CODE_SIGNING_ALLOWED=NO
