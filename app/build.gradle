plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "com.google.devtools.ksp"
}

android {
    namespace "br.com.machadodeassis.biblioteca"
    compileSdk 36
    defaultConfig {
        applicationId "br.com.machadodeassis.biblioteca"
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName "1.4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            def propsFile = rootProject.file("keystore.properties")
            if (propsFile.exists()) {
                def props = new Properties(); props.load(new FileInputStream(propsFile))
                storeFile rootProject.file(props["storeFile"])
                storePassword props["storePassword"]; keyAlias props["keyAlias"]; keyPassword props["keyPassword"]
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release; proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro" } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = "17" }
    buildFeatures { compose true }
    testOptions { unitTests { includeAndroidResources = true; returnDefaultValues = true } }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2025.02.00")
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.datastore:datastore-preferences:1.1.2"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    def room = "2.6.1"
    implementation "androidx.room:room-runtime:$room"
    implementation "androidx.room:room-ktx:$room"
    ksp "androidx.room:room-compiler:$room"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    testImplementation "org.robolectric:robolectric:4.13"
    testImplementation "androidx.test:core:1.6.1"
    testImplementation "androidx.room:room-testing:$room"
}
